name: Bug report
description: Something in Prime Council does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a **security** problem, do not open an issue: use **Security → Report a vulnerability** (see SECURITY.md).
        Never paste API keys or `.env.local` contents here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm run dev
        2. Open /world
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Demo mode (no keys)
        - Real model provider(s)
        - Not sure
    validations:
      required: true
  - type: input
    id: providers
    attributes:
      label: Providers involved
      description: e.g. Anthropic, OpenAI, Gemini, Ollama, OpenAI-compatible. Names only, no keys.
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - Embedded PostgreSQL (PGlite, default)
        - PostgreSQL server (DATABASE_URL)
  - type: input
    id: version
    attributes:
      label: Commit and Node.js version
      placeholder: "git rev-parse --short HEAD → abc1234 · node -v → v22.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Server output or browser console. Check that no keys or tokens are included.
      render: text
