# Optional local PostgreSQL. The app also runs without it (embedded PGlite).
#   docker compose up -d db
#   DATABASE_URL=postgres://simlife:simlife@localhost:5432/simlife npm run dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: simlife
      POSTGRES_PASSWORD: simlife
      POSTGRES_DB: simlife
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - simlife-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simlife"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  simlife-db:
